<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>특송 업무 통합 대시보드</title>
<style>
:root {
  --bg:#eef3f8; --nav:#0f172a; --nav2:#172554; --white:#fff;
  --text:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;background:var(--bg)}
body{overflow:hidden}
.app-shell{height:100vh;display:flex;flex-direction:column}
.topbar{
  background:linear-gradient(135deg,var(--nav),var(--nav2));
  color:white;padding:12px 16px;display:flex;align-items:center;gap:14px;
  box-shadow:0 4px 18px rgba(15,23,42,.24);z-index:10
}
.brand{min-width:220px}
.brand .title{font-size:16px;font-weight:900;letter-spacing:-.02em}
.brand .sub{font-size:11px;color:var(--muted);margin-top:3px}
.tabs{display:flex;gap:8px;flex:1;justify-content:center}
.tab{
  appearance:none;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:#cbd5e1;
  border-radius:11px;padding:10px 15px;font-weight:800;font-size:13px;cursor:pointer
}
.tab.active{background:white;color:#1e3a8a;border-color:white}
.security{font-size:11px;color:#cbd5e1;text-align:right;min-width:220px}
.frames{position:relative;flex:1;min-height:0}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
.frame.active{display:block}
.mobile-select{display:none;width:100%;background:#fff;color:#0f172a;border:0;border-radius:10px;padding:10px;font-weight:800}
@media(max-width:800px){
  .topbar{display:block;padding:10px}
  .brand{min-width:0;margin-bottom:8px}
  .brand .sub{display:none}
  .tabs{display:none}
  .security{display:none}
  .mobile-select{display:block}
}
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="title">특송 업무 통합 대시보드</div>
      <div class="sub">원산지 일괄입력 · 주문처/EPN 매칭 검증</div>
    </div>

    <nav class="tabs">
      <button class="tab active" data-target="originFrame">원산지 일괄입력</button>
      <button class="tab" data-target="epnFrame">주문처 ↔ EPN 검증</button>
    </nav>

    <select id="mobileMenu" class="mobile-select" aria-label="업무 선택">
      <option value="originFrame">원산지 일괄입력</option>
      <option value="epnFrame">주문처 ↔ EPN 검증</option>
    </select>

    <div class="security">각 업무 화면은 브라우저에서 실행됩니다.</div>
  </header>

  <main class="frames">
    <iframe id="originFrame" class="frame active" title="원산지 일괄입력"></iframe>
    <iframe id="epnFrame" class="frame" title="주문처 EPN 검증"></iframe>
  </main>
</div>

function b64ToUtf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

document.getElementById("originFrame").srcdoc = b64ToUtf8(originB64);
document.getElementById("epnFrame").srcdoc = b64ToUtf8(epnB64);

function switchFrame(id) {
  document.querySelectorAll(".frame").forEach(f=>f.classList.toggle("active", f.id===id));
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b.dataset.target===id));
  document.getElementById("mobileMenu").value=id;
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>switchFrame(btn.dataset.target));
});
document.getElementById("mobileMenu").addEventListener("change",e=>switchFrame(e.target.value));
</script>
